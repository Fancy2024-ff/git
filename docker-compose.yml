# Miniapp Factory – docker-compose
# Usage:
#   cp .env.example .env   # fill in DASHBOARD_API_KEY and ANTHROPIC_API_KEY
#   docker compose up --build
#
# 架构口径：miniapp 代码生成的唯一执行真源是 Python core/generator/codegen.py
# （由 apps/api → core/pipeline/runner.py 调用）。Node generator 服务不在生产
# 主链路中，已从正式编排移除（仅作 vitest / Node 生态兼容工具链，见
# core/generator/README）。因此本 compose 不再起该服务，也不再要求其鉴权/地址变量。

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:?Set DASHBOARD_API_KEY in .env}
      - DASHBOARD_ORIGIN=http://localhost:5173
      - PIPELINE_TIMEOUT_SECONDS=${PIPELINE_TIMEOUT_SECONDS:-600}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      - QA_INSTALL_TIMEOUT=${QA_INSTALL_TIMEOUT:-600}
      - QA_BUILD_TIMEOUT=${QA_BUILD_TIMEOUT:-600}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_PROJECT_NAME=${CLOUDFLARE_PROJECT_NAME:-miniforge-app}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - WEBAPP_LLM_BASE_URL=${WEBAPP_LLM_BASE_URL:-https://api.deepseek.com}
      - WEBAPP_LLM_API_KEY=${WEBAPP_LLM_API_KEY:-}
      - WEBAPP_LLM_MODEL=${WEBAPP_LLM_MODEL:-deepseek-chat}
    volumes:
      - ./data/outputs:/app/data/outputs
      - ./data/inputs/real:/app/data/inputs/real
      - ./data/platform-auth:/app/data/platform-auth
    healthcheck:
      # 与 apps/api/main.py 的公共状态接口一致；dashboard 依赖此 healthcheck。
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/pipeline/status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
        # NOTE: VITE_API_TOKEN is baked into the JS bundle at build time.
        # Changing the API key requires rebuilding this image:
        #   docker compose build dashboard
        # For runtime-configurable tokens, see infra/docker/Dockerfile.web's
        # /config.json approach (nginx serves a runtime config file).
        VITE_API_TOKEN: ${DASHBOARD_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
